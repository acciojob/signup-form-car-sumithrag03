<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
	<form method="post">
		<label for="name">Name:</label>
		<input type="text" id="name" required  placeholder="Name">

		<label for="email">Email:</label>
		<input type="email" id="email" required placeholder="Email">

		<label for="gender">Male</label>
		<input type="radio" id="gender_m" required name="gender">
		
		<label for="gender">Female</label>
		<input type="radio" id="gender_f" required name="gender">

		<label for="cars">Car Brands:</label>
		<select required id="cars">
			<option>--Please choose an option--"</option>
			<option value="bmw">Bmw</option>
			<option value="aadi">Aadi</option>
			<option value="range over">range overs</option>
		</select>

		<label for="age">Age:</label>
		<input type="number" required id="age" placeholder="Age">

		<label for="dob">DOB:</label>
		<input type="date" id="dob" required>

		<label for="phonenumber">Phone Number:</label>
		<input type="tel" id="tel" placeholder="xxx-xxx-xxxx">

		<label for="password"id="password">password</label>
		<input type="password" required id="password" placeholder="Password">

		<label for="checkbox" id="tos">I agree to the TOS	</label>
		<input type="checkbox" required id="tos">
		
		<button type="submit">submit</button>
	</form>

</body>

</html>
